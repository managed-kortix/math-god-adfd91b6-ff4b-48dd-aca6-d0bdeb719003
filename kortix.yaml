kortix_version: 2
default_agent: math-god
project:
  name: math-god
  description: "A high-entropy autonomous mathematics laboratory. One math-god
    agent runs exactly three isolated pinned lanes: the main trajectory, the six unsolved
    Clay problems, and one frozen certificate-shaped breakthrough target. Kortix
    remains the ordinary finite-purpose agent. Public claims are exact,
    adversarially audited, reproducible, and distributed through the committed
    publication workflow."
env:
  required:
    - TWITTER_CONSUMER_KEY
    - TWITTER_CONSUMER_SECRET
    - TWITTER_ACCESS_TOKEN
    - TWITTER_ACCESS_TOKEN_SECRET
    - TWITTER_BEARER_TOKEN
  optional:
    - WOLFRAM_APP_ID
    - CODEX_AUTH_JSON
opencode:
  config_dir: .kortix/opencode
agents:
  kortix:
    connectors: all
    secrets: all
    kortix_cli: all
    skills: all
    workspace: runtime
  math-god:
    connectors: all
    secrets: all
    kortix_cli: all
    skills: all
    workspace: runtime
triggers:
  - slug: math-heartbeat
    name: math-god main lane heartbeat
    type: cron
    agent: math-god
    enabled: true
    session_mode: pinned
    session_id: e5dcbc87-2c7c-4f1d-9f1d-8c9b7423dfff
    cron: 0 0 */6 * * *
    timezone: UTC
    prompt: "LANE=main. CORE=math-god-main. This exact pinned root session permanently owns only the main lane.
      Read STATE.md first; do not adopt MILLENNIUM_STATE.md or BREAKTHROUGH_STATE.md
      as working memory. Run `python3 scripts/check-core-sessions.py`; reconcile
      any extra autonomous math-god root before research, but never create a new
      root unless a registered core is irrecoverably dead and the registry plus
      pinned trigger are atomically replaced. Continue the exact frontier. Run
      `bash scripts/setup-harness.sh` when fresh. Pull --rebase, commit, and push
      durable work. Once per UTC day, run the publication inbox/OCB review in
      research/procedural/PUBLICATION.md: process relevant replies in their
      existing threads, check pending Board records, and update token-free
      ledgers without spamming. Apply the complete publication workflow in
      research/procedural/PUBLICATION.md to every verified result. Never stop."
  - slug: millennium-heartbeat
    name: math-god Millennium lane heartbeat
    type: cron
    agent: math-god
    enabled: true
    session_mode: pinned
    session_id: a10f0b25-6c8a-488e-b880-c54c9f7aaa98
    cron: 0 0 3/6 * * *
    timezone: UTC
    prompt: "LANE=millennium. CORE=math-god-millennium. This exact pinned root session permanently owns only the six
      unsolved Clay problems. Read MILLENNIUM_STATE.md and
      millennium-prize/PROGRAM.md first; do not adopt STATE.md or
      BREAKTHROUGH_STATE.md as working memory. Do not spawn Kortix root sessions;
      maximize entropy with Task subagents inside this core. Continue the active exact frontier,
      maintain bounded scouts, and never call a partial result a solution. Pull
      --rebase, commit, and push durable work. Apply
      research/procedural/PUBLICATION.md only after every official-resolution
      gate passes. Never stop."
  - slug: breakthrough-heartbeat
    name: math-god breakthrough lane heartbeat
    type: cron
    agent: math-god
    enabled: true
    session_mode: pinned
    session_id: 45a63659-bb8c-4524-86d8-c52dde0362b5
    cron: 0 0 1 * * *
    timezone: UTC
    prompt: "LANE=breakthrough. CORE=math-god-breakthrough. This exact pinned root session permanently owns only the
      frozen assignment in BREAKTHROUGH_STATE.md. Read that file,
      breakthrough/PROGRAM.md, and the assignment prompt first; do not adopt
      STATE.md or MILLENNIUM_STATE.md as working memory. Do not spawn Kortix root
      sessions; maximize entropy with Task subagents on the frozen target. If status is active,
      never resurvey or switch targets. Select a new target only after a solved
      or formally retired assignment has completed its publication/state closeout.
      Pull --rebase, commit, and push durable work. Apply
      research/procedural/PUBLICATION.md to a verified result. Never stop."
connectors:
  - slug: google_drive
    provider: pipedream
    app: google_drive
    account: default
  - slug: gmail
    provider: pipedream
    app: gmail
    account: default
