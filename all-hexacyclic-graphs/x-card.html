<html><head><meta charset="utf-8"><style>

</style></head><body><div class="card">
<div class="kicker">positive square energy · exact theorem</div>
<h1>Every connected hexacyclic graph satisfies the conjectured bound.</h1>
<p class="theorem">If <span class="formula">G</span> is finite, simple, connected, and <span class="formula">|E(G)| = |V(G)| + 5</span>, then<br><span class="formula">s⁺(G) ≥ |V(G)|.</span></p>
<div class="proof">1,198 suppressed kernels · exact segmented certificates · full block decomposition</div>
</div></body></html>
